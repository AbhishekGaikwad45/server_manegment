<!DOCTYPE html>
<html>
<head>
  <title>Edit Server</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="card shadow-sm">

    <div class="card-header">
      <h3>Edit Server</h3>
    </div>

    <div class="card-body">

      <form method="POST">

        <div class="mb-3">
          <label>Name</label>

          <input type="text"
                 name="name"
                 class="form-control"
                 value="{{ server.name }}"
                 required>
        </div>

        <div class="mb-3">
          <label>IP Address</label>

          <input type="text"
                 name="ip"
                 class="form-control"
                 value="{{ server.ip }}"
                 required>
        </div>

        <div class="mb-3">
          <label>Port</label>

          <input type="number"
                 name="port"
                 class="form-control"
                 value="{{ server.port }}">
        </div>

        <div class="mb-3">
          <label>Parent Server</label>

          <select name="parent_id"
                  class="form-control">

            <option value="">
              No Parent
            </option>

            {% for p in parents %}

            <option value="{{ p.id }}"
              {% if server.parent_id == p.id %}
                selected
              {% endif %}
            >
              {{ p.name }}
            </option>

            {% endfor %}

          </select>
        </div>

        <div class="mb-3">
          <label>SSH User</label>

          <input type="text"
                 name="ssh_user"
                 class="form-control"
                 value="{{ server.ssh_user }}">
        </div>

        <div class="mb-3">
          <label>SSH Password</label>

          <input type="text"
                 name="ssh_password"
                 class="form-control"
                 value="{{ server.ssh_password }}">
        </div>

        <div class="mb-3">
          <label>Restart Command</label>

          <input type="text"
                 name="restart_command"
                 class="form-control"
                 value="{{ server.restart_command }}">
        </div>

        <button type="submit"
                class="btn btn-success">
          Update Server
        </button>

        <a href="/"
           class="btn btn-secondary">
          Cancel
        </a>

      </form>

    </div>

  </div>

</div>

</body>
</html>
