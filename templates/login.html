<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServerWatch — Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
        <rect width="36" height="36" rx="10" fill="#185FA5"/>
        <rect x="8" y="10" width="20" height="4" rx="2" fill="white" opacity="0.9"/>
        <rect x="8" y="16" width="20" height="4" rx="2" fill="white" opacity="0.6"/>
        <rect x="8" y="22" width="20" height="4" rx="2" fill="white" opacity="0.3"/>
        <circle cx="26" cy="12" r="2.5" fill="#4ade80"/>
        <circle cx="26" cy="18" r="2.5" fill="#facc15"/>
        <circle cx="26" cy="24" r="2.5" fill="#f87171"/>
      </svg>
      <span>ServerWatch</span>
    </div>
    <h1>Sign in</h1>
    <p class="login-sub">Monitor your 30+ servers in one place</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert-banner">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="admin" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary btn-full">Sign in</button>
    </form>
    <p class="login-hint">Default: admin / admin123</p>
  </div>
</div>
</body>
</html>
