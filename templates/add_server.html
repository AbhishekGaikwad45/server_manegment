<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ServerWatch — Add Server</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

<style>

/* =========================================
   CENTER MAIN CONTENT
========================================= */

.main {

    flex: 1;

    overflow-y: auto;

    padding: 24px 28px;

    display: flex;

    justify-content: center;
}


/* =========================================
   PAGE WRAPPER
========================================= */

.page-wrapper {

    width: 100%;

    max-width: 1100px;
}


/* =========================================
   FORM CARD
========================================= */

.form-card {

    background: #fff;

    border: 1px solid #e8e8e8;

    border-radius: 12px;

    padding: 28px;

    width: 100%;

    max-width: 1000px;

    margin: 0 auto;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 992px) {

    .form-grid {

        grid-template-columns: 1fr;
    }

    .form-card {

        max-width: 100%;
    }
}

@media (max-width: 768px) {

    .main {

        padding: 18px;
    }

    .topbar {

        flex-direction: column;

        gap: 14px;

        align-items: flex-start;
    }

    .form-actions {

        flex-direction: column-reverse;
    }

    .form-actions .btn-primary,
    .form-actions .btn-outline {

        width: 100%;

        justify-content: center;
    }
}

</style>
</head>

<body>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

  <div class="sidebar-brand">

    <svg width="28"
         height="28"
         viewBox="0 0 36 36"
         fill="none">

      <rect width="36"
            height="36"
            rx="8"
            fill="#185FA5"/>

      <rect x="8"
            y="10"
            width="20"
            height="4"
            rx="2"
            fill="white"
            opacity="0.9"/>

      <rect x="8"
            y="16"
            width="20"
            height="4"
            rx="2"
            fill="white"
            opacity="0.6"/>

      <rect x="8"
            y="22"
            width="20"
            height="4"
            rx="2"
            fill="white"
            opacity="0.3"/>

      <circle cx="26"
              cy="12"
              r="2.5"
              fill="#4ade80"/>

      <circle cx="26"
              cy="18"
              r="2.5"
              fill="#facc15"/>

      <circle cx="26"
              cy="24"
              r="2.5"
              fill="#f87171"/>

    </svg>

    <span class="brand-text">
      ServerWatch
    </span>

  </div>


  <button class="sidebar-toggle"
          onclick="toggleSidebar()"
          title="Toggle Sidebar">

    <svg width="16"
         height="16"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         viewBox="0 0 24 24">

      <polyline points="15 18 9 12 15 6"/>

    </svg>

  </button>


  <nav class="sidebar-nav">

    <a href="/"
       class="nav-link">

      <svg width="18"
           height="18"
           fill="none"
           stroke="currentColor"
           stroke-width="1.5"
           viewBox="0 0 24 24">

        <rect x="3"
              y="3"
              width="7"
              height="7"
              rx="1"/>

        <rect x="14"
              y="3"
              width="7"
              height="7"
              rx="1"/>

        <rect x="3"
              y="14"
              width="7"
              height="7"
              rx="1"/>

        <rect x="14"
              y="14"
              width="7"
              height="7"
              rx="1"/>

      </svg>

      <span class="nav-text">
        Dashboard
      </span>

    </a>


    <a href="/servers/add"
       class="nav-link active">

      <svg width="18"
           height="18"
           fill="none"
           stroke="currentColor"
           stroke-width="1.5"
           viewBox="0 0 24 24">

        <circle cx="12"
                cy="12"
                r="9"/>

        <line x1="12"
              y1="8"
              x2="12"
              y2="16"/>

        <line x1="8"
              y1="12"
              x2="16"
              y2="12"/>

      </svg>

      <span class="nav-text">
        Add Server
      </span>

    </a>

  </nav>


  <div class="sidebar-footer">

    <span class="user-name">
      {{ session['user'] }}
    </span>

    <a href="/logout"
       class="btn-logout">
      Logout
    </a>

  </div>

</aside>


<!-- MAIN -->
<main class="main">

  <div class="page-wrapper">

    <!-- TOPBAR -->
    <div class="topbar">

      <div>

        <h1 class="page-title">
          Add Server
        </h1>

        <p class="page-sub">
          Register a new server to monitor
        </p>

      </div>

      <a href="/"
         class="btn-outline">

        ← Back

      </a>

    </div>


    <!-- FORM -->
    <div class="form-card">

      <form method="POST">

        <div class="form-grid">

          <!-- SERVER NAME -->
          <div class="form-group">

            <label>
              Server Name
              <span class="req">*</span>
            </label>

            <input type="text"
                   name="name"
                   placeholder="e.g. DB-Server-01"
                   required>

          </div>


          <!-- IP -->
          <div class="form-group">

            <label>
              IP Address
              <span class="req">*</span>
            </label>

            <input type="text"
                   name="ip"
                   placeholder="192.168.1.10"
                   required>

          </div>


          <!-- PORT -->
          <div class="form-group">

            <label>SSH Port</label>

            <input type="number"
                   name="port"
                   value="22"
                   min="1"
                   max="65535">

          </div>


          <!-- PARENT -->
          <div class="form-group">

            <label>Parent Server</label>

            <select name="parent_id">

              <option value="">
                — None (this is a parent) —
              </option>

              {% for p in parents %}

              <option value="{{ p.id }}">
                {{ p.name }} ({{ p.ip }})
              </option>

              {% endfor %}

            </select>

            <p class="field-hint">
              Select a parent if this is a child/slave server
            </p>

          </div>


          <!-- SSH USER -->
          <div class="form-group">

            <label>SSH Username</label>

            <input type="text"
                   name="ssh_user"
                   placeholder="root">

          </div>


          <!-- SSH PASS -->
          <div class="form-group">

            <label>SSH Password</label>

            <input type="password"
                   name="ssh_password"
                   placeholder="For restart via SSH">

            <p class="field-hint">
              Used only when you click Restart
            </p>

          </div>


          <!-- RESTART COMMAND -->
          <div class="form-group full-width">

            <label>Restart Command</label>

            <input type="text"
                   name="restart_command"
                   value="sudo systemctl restart nginx"
                   placeholder="sudo systemctl restart myservice">

            <p class="field-hint">
              Command to run on SSH when you click Restart
            </p>

          </div>

        </div>


        <!-- ACTIONS -->
        <div class="form-actions">

          <a href="/"
             class="btn-outline">

            Cancel

          </a>

          <button type="submit"
                  class="btn-primary">

            Add Server

          </button>

        </div>

      </form>

    </div>

  </div>

</main>

</div>


<script>

function toggleSidebar() {

  const sidebar =
    document.getElementById('sidebar');

  sidebar.classList.toggle('collapsed');
}

</script>

</body>
</html>
