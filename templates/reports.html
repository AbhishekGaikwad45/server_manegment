<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
  Reports
</title>

<link rel="stylesheet"
      href="{{ url_for('static',
      filename='css/style.css') }}">

</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

  <div class="sidebar-brand">

    <svg width="28"
         height="28"
         viewBox="0 0 36 36"
         fill="none">

      <rect width="36"
            height="36"
            rx="8"
            fill="#185FA5"/>

      <rect x="8"
            y="10"
            width="20"
            height="4"
            rx="2"
            fill="white"
            opacity="0.9"/>

      <rect x="8"
            y="16"
            width="20"
            height="4"
            rx="2"
            fill="white"
            opacity="0.6"/>

      <rect x="8"
            y="22"
            width="20"
            height="4"
            rx="2"
            fill="white"
            opacity="0.3"/>

      <circle cx="26"
              cy="12"
              r="2.5"
              fill="#4ade80"/>

      <circle cx="26"
              cy="18"
              r="2.5"
              fill="#facc15"/>

      <circle cx="26"
              cy="24"
              r="2.5"
              fill="#f87171"/>

    </svg>

    <span class="brand-text">
      ServerWatch
    </span>

  </div>


  <button class="sidebar-toggle"
          onclick="toggleSidebar()"
          title="Toggle Sidebar">

    <svg width="16"
         height="16"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         viewBox="0 0 24 24">

      <polyline points="15 18 9 12 15 6"/>

    </svg>

  </button>


  <nav class="sidebar-nav">

    <a href="/"
       class="nav-link">

      <svg width="18"
           height="18"
           fill="none"
           stroke="currentColor"
           stroke-width="1.5"
           viewBox="0 0 24 24">

        <rect x="3"
              y="3"
              width="7"
              height="7"
              rx="1"/>

        <rect x="14"
              y="3"
              width="7"
              height="7"
              rx="1"/>

        <rect x="3"
              y="14"
              width="7"
              height="7"
              rx="1"/>

        <rect x="14"
              y="14"
              width="7"
              height="7"
              rx="1"/>

      </svg>

      <span class="nav-text">
        Dashboard
      </span>

    </a>


    <a href="/servers/add"
       class="nav-link">

      <svg width="18"
           height="18"
           fill="none"
           stroke="currentColor"
           stroke-width="1.5"
           viewBox="0 0 24 24">

        <circle cx="12"
                cy="12"
                r="9"/>

        <line x1="12"
              y1="8"
              x2="12"
              y2="16"/>

        <line x1="8"
              y1="12"
              x2="16"
              y2="12"/>

      </svg>

      <span class="nav-text">
        Add Server
      </span>

    </a>


    <a href="/reports"
       class="nav-link active">

      <svg width="18"
           height="18"
           fill="none"
           stroke="currentColor"
           stroke-width="1.5"
           viewBox="0 0 24 24">

        <path d="M8 6h13"/>
        <path d="M8 12h13"/>
        <path d="M8 18h13"/>
        <path d="M3 6h.01"/>
        <path d="M3 12h.01"/>
        <path d="M3 18h.01"/>

      </svg>

      <span class="nav-text">
        Reports
      </span>

    </a>

  </nav>


  <div class="sidebar-footer">

    <span class="user-name">

      {{ session['user'] }}

    </span>

    <a href="/logout"
       class="btn-logout">

      Logout

    </a>

  </div>

</aside>

  <main class="main">

    <div class="page-wrapper">

      <div class="topbar">

        <div>

          <h1 class="page-title">
            Server Reports
          </h1>

          <p class="page-sub">
            Preview and export reports
          </p>

        </div>

      </div>


      <!-- FILTERS -->
      <div class="section-card">

        <div class="form-grid">

          <div class="form-group">

            <label>
              From Date
            </label>

            <input type="datetime-local"
                   id="from-date">

          </div>

          <div class="form-group">

            <label>
              To Date
            </label>

            <input type="datetime-local"
                   id="to-date">

          </div>

        </div>

        <div class="form-actions">

          <button class="btn-primary"
                  onclick="loadPreview()">

            Preview Report

          </button>

          <button class="btn-outline"
                  onclick="downloadReport()">

            Download Excel

          </button>

        </div>

      </div>


      <!-- PREVIEW -->
      <div class="section-card">

        <div class="table-wrap">

          <table class="server-table">

            <thead>

              <tr>

                <th>Server</th>
                <th>IP</th>
                <th>Status</th>
                <th>Ping</th>
                <th>Parent</th>
                <th>Last Checked</th>

              </tr>

            </thead>

            <tbody id="report-body">

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </main>

</div>


<script>

async function loadPreview() {

    const from =
      document.getElementById(
        'from-date'
      ).value;

    const to =
      document.getElementById(
        'to-date'
      ).value;

    if (!from || !to) {

      alert('Select date range');

      return;
    }

    const res =
      await fetch(
        `/api/report-preview?from=${from}&to=${to}`
      );

    const data =
      await res.json();
     console.log(data);
    const tbody =
      document.getElementById(
        'report-body'
      );

    tbody.innerHTML = '';

    data.forEach(r => {

      tbody.innerHTML += `

        <tr>

          <td>${r.name}</td>

          <td>${r.ip}</td>

          <td>${r.status}</td>

          <td>${r.ping_ms || '-'}</td>

          <td>${r.parent_name}</td>

          <td>${r.last_checked}</td>

        </tr>

      `;
    });
}


function downloadReport() {

    const from =
      document.getElementById(
        'from-date'
      ).value;

    const to =
      document.getElementById(
        'to-date'
      ).value;

    if (!from || !to) {

      alert('Select date range');

      return;
    }

    window.location.href =
      `/export/report?from=${from}&to=${to}`;
}


function toggleSidebar() {

  document
    .getElementById('sidebar')
    .classList.toggle('collapsed');
}

document.addEventListener(
  'DOMContentLoaded',
  () => {

    const now = new Date();

    // TODAY START
    const start = new Date();

    start.setHours(0);
    start.setMinutes(0);

    // FORMAT FUNCTION
    function formatDate(date) {

      const year =
        date.getFullYear();

      const month =
        String(
          date.getMonth() + 1
        ).padStart(2, '0');

      const day =
        String(
          date.getDate()
        ).padStart(2, '0');

      const hours =
        String(
          date.getHours()
        ).padStart(2, '0');

      const minutes =
        String(
          date.getMinutes()
        ).padStart(2, '0');

      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    document.getElementById(
      'from-date'
    ).value = formatDate(start);

    document.getElementById(
      'to-date'
    ).value = formatDate(now);
    loadPreview();
  }
);
</script>

</body>
</html>
